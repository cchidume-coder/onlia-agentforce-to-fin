                    is_required: False
                    is_user_input: True
                "newState": string
                    description: |
                        Stores the value of the new state provided by the customer. If no change is desired, this variable is empty.
                    label: "New State"
                    is_required: False
                    is_user_input: True
                "newStreetAddress": string
                    description: |
