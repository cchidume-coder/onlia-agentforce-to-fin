subagent ServiceCustomerVerification:
    label: "Service Customer Verification"
    description: "Verifies the customer's identity before granting access to sensitive data. Actions like managing cases, retrieving/managing orders, or making a reservation require identity verification. Sensitive data includes confidential, private, or security-protected information, such as business-critical data or personally identifiable information (PII). After verification is successful, don't repeat the process within the same session."
    reasoning:
        instructions: ->
            |Ask the customer to enter their username or email address if it hasn't been provided.

             Use the {!@actions.SendEmailVerificationCode} action to initiate the verification process. Use the username or email address provided by the customer as input "customerToVerify" for this action.

             When the user provides their username or email address, you must never return any message that discloses whether the user or email exists or not. The message must explicitly state the return data of the {!@actions.VerifyCustomer}field in the {!@actions.SendEmailVerificationCode} action. For example: "If you have provided a valid email or username, you should receive a verification code to verify your identity. Please enter the code."

             If the customer enters the wrong verification code three times, ask them to re-enter their username or email address to receive a new verification code. This involves invoking the {!@actions.SendEmailVerificationCode}action again to initiate the verification process. This ensures that the customer cannot bypass the verification process after three unsuccessful attempts.

             Never process any request for accessing or updating any sensitive data without invoking this function if the customer is not verified yet. Maintain security in all interactions.

             Never reveal the verification code, email address, or username to the customer during the authentication process. Make sure that these details remain confidential and aren’t displayed at any point.

             After the user is verified in a conversation session, switching to a different user isn't allowed under any circumstances.

             If verification is successful, proceed with the requested action and complete the task the user intends to perform.
        actions:
            VerifyCustomer: @actions.VerifyCustomer
                with authenticationKey = @variables.authKey
                with customerCode = ...
                with customerId = @variables.ResolvedContactId
                with customerType = @variables.Resolved_Contact_Type
                set @variables.isCustomerVerified = @outputs.isVerified
                set @variables.EffectiveContactId = @outputs.customerId
            SendEmailVerificationCode: @actions.SendEmailVerificationCode
                with customerToVerify = ...
                set @variables.authKey = @outputs.authenticationKey
                set @variables.ResolvedContactId = @outputs.customerId
                set @variables.Resolved_Contact_Type = @outputs.customerType
    actions:
        SendEmailVerificationCode:
            description: "Sends a generated verification code to the user's email address."
            label: "Send Email with Verification Code"
            require_user_confirmation: False
            include_in_progress_indicator: True
            source: "SvcCopilotTmpl__SendEmailVerificationCode"
            target: "flow://SvcCopilotTmpl__SendVerificationCode"
            inputs:
                "customerToVerify": string
                    description: |
                        Stores the email address or username provided by the customer. This input initiates the verification process.
                    label: "Customer To Verify"
                    is_required: True
                    is_user_input: True
            outputs:
                "verificationMessage": string
                    description: |
                        Stores a generic message that will be displayed to the user.
                    label: "Verification Message"
                    is_displayable: True
                    filter_from_agent: False
                "verificationCode": string
                    description: |
                        Stores the generated verification code.
                    label: "Verification Code"
                    is_displayable: False
                    filter_from_agent: True
                "authenticationKey": string
                    description: |
                        Stores the authentication key that's used to generate the verification code.
                    label: "Authentication Key"
                    is_displayable: False
                    filter_from_agent: True
                "customerId": string
                    description: |
                        Stores the Salesforce user ID or contact ID.
                    label: "Customer ID"
                    is_displayable: False
                    filter_from_agent: True
                "customerType": string
                    description: |
                        Stores the customer ID type, whether it's a Salesforce user or a contact.
                    label: "Customer Type"
                    is_displayable: False
                    filter_from_agent: True
            progress_indicator_message: "one sec"
        VerifyCustomer:
            description: "Verifies whether the verification code entered by the user matches the code sent to the user's email address."
            label: "Verify Customer"
            require_user_confirmation: False
            include_in_progress_indicator: True
            source: "SvcCopilotTmpl__VerifyCustomer"
            target: "flow://SvcCopilotTmpl__VerifyCode"
            inputs:
                "authenticationKey": string
                    description: |
                        Stores the authentication key that's used to generate the verification code.
                    label: "Authentication Key"
                    is_required: True
                    is_user_input: False
                "customerCode": string
                    description: |
                        Stores the verification code entered by the user in the conversation, which they received by email.
                    label: "Customer Code"
                    is_required: True
                    is_user_input: True
                "customerId": string
                    description: |
                        Stores the Salesforce user ID or contact ID.
                    label: "Customer ID"
                    is_required: True
                    is_user_input: False
                "customerType": string
                    description: |
                        Stores the customer ID type, whether it's a Salesforce user or a contact.
                    label: "Customer Type"
                    is_required: True
                    is_user_input: False
            outputs:
                "isVerified": boolean
                    description: |
                        Stores a boolean value that indicates whether the customer code is verified.
                    label: "Verified"
                    is_displayable: False
                    filter_from_agent: True
                "customerId": string
                    description: |
                        Stores the Salesforce user ID or contact ID.
                    label: "Customer Id"
                    is_displayable: False
                    filter_from_agent: True
                "customerType": string
                    description: |
                        Stores Type of ID
                    label: "Customer Type"
                    is_displayable: False
                    filter_from_agent: True
                "messageAfterVerification": string
                    description: |
                        Stores a generic message to be displayed after successful verification.
                    label: "Message After Verification"
                    is_displayable: True
                    filter_from_agent: False
            progress_indicator_message: "okay let me check those details"

