                        Stores the value of the new city provided by the customer. If no change is desired, this variable is empty.
                    label: "New City"
                    is_required: False
                    is_user_input: True
                "newEmailAddress": string
                    description: |
                        Stores the value of the new email address provided by the customer. If no change is desired, this variable is empty.
                    label: "New Email Address"
                    is_required: False
                    is_user_input: True
                "newPhoneNumber": string
                    description: |
                        Stores the value of the new phone number provided by the customer. If no change is desired, this variable is empty.
                    label: "New Phone Number"
                    is_required: False
                    is_user_input: True
                "newPostalCode": string
