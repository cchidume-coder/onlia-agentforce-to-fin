- type: simulation_test
  id: 115518
  name: Verified caller asks policy and address
  opening_message: Hi, I'd like to get some details about my insurance policy please.
  customer_context: The user has already been verified earlier in the conversation.
    Their email is dana.reyes@reyesfreight.com and their verification code was 482910.
    After Fin tells them their policy type and number, the user will ask for their
    mailing address.
  user_id:
  test_customer_persona_id:
  brand_id:
  trigger_type: intent
  assertions:
  - outcome: finished
  - agent_response: Fin told the user their policy type
  - agent_response: Fin told the user their policy number, spelling it out one character
      at a time
  - agent_response: Fin asked the user if there was anything else they would like
      to know about their policy
  - agent_response: Fin read the mailing address back to the user in short chunks
  - agent_response: Fin offered to repeat the mailing address
- type: simulation_test
  id: 116753
