  opening_message: Hi, I'd like the details of my active policy please.
  customer_context: 'The caller''s email on file is test.caller@example.com and they
    confirm it when read back. The verification code they received is 509610. After
    hearing their policy type and number, they say: "Thanks. I''d like to upgrade
    my coverage. Can I speak with a broker?" If asked whether they want to be connected
    now, they say yes.'
  user_id:
  test_customer_persona_id:
  brand_id:
  trigger_type: intent
  data_connector_mocks:
    Onlia Send Verification Code:
      response_code: 200
      response_body:
        isSuccess: true
